name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: stigpt-deploy
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

  deploy:
    name: Deploy to Aliyun
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          HOST="${{ secrets.ALIYUN_HOST || '121.89.87.255' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote rsync
        run: |
          ssh "${{ secrets.ALIYUN_USER || 'root' }}@${{ secrets.ALIYUN_HOST || '121.89.87.255' }}" '
            set -euo pipefail
            if command -v rsync >/dev/null 2>&1; then
              exit 0
            fi
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y rsync || command -v rsync
            elif command -v yum >/dev/null 2>&1; then
              yum install -y rsync || command -v rsync
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache rsync || command -v rsync
            else
              echo "No supported package manager found for installing rsync"
              exit 1
            fi
          '

      - name: Sync backend sources
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'logs' \
            --exclude 'uploads' \
            ./ "${{ secrets.ALIYUN_USER || 'root' }}@${{ secrets.ALIYUN_HOST || '121.89.87.255' }}:/opt/stigpt/backend/"

      - name: Rebuild backend container if compose stack exists
        run: |
          ssh "${{ secrets.ALIYUN_USER || 'root' }}@${{ secrets.ALIYUN_HOST || '121.89.87.255' }}" '
            set -euo pipefail
            if [ -f /opt/stigpt/frontent/docker-compose.yml ]; then
              cd /opt/stigpt/frontent
              if [ -f .env ]; then
                docker compose -p stigpt up -d --build backend
              fi
            fi
          '
